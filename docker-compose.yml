# Uso:  docker compose run --rm train   (1ª vez)  ->  docker compose up app
# Requiere data/raw/diabetic_data.csv e IDS_mapping.csv en el equipo anfitrión.
x-project: &project
  build: .
  image: diabetes-readmission-predictor
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts
    - ./reports:/app/reports
    - ./notebooks:/app/notebooks

services:
  app:
    <<: *project
    command: app
    ports: ["8501:8501"]
  train:
    <<: *project
    command: train
    profiles: ["tools"]
  all:
    <<: *project
    command: all
    profiles: ["tools"]
  lab:
    <<: *project
    command: lab
    ports: ["8888:8888"]
    profiles: ["tools"]
  test:
    <<: *project
    command: test
    profiles: ["tools"]
