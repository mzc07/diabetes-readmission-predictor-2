[project]
name = "diabetes-readmission-predictor"
version = "0.1.0"
description = "Predict if the pacient will be readmitted in less than 30 days"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Martin Ariza", email = "martin.ariza.camargo@gmail.com"},
    { name = "Ivanna Alvarez", email = "ivannaisabelalvarezs@gmail.com"},
    { name = "Maria Rueda", email="julianarp8@gmail.com"}
]

dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "lightgbm",
  "shap",
  "matplotlib",
  "seaborn",
  "streamlit", 
  "jupyterlab",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "nbconvert",
    "ipykernel",
    "nbformat"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
